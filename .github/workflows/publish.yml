name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish packages to npm and GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build minified packages
        run: npm run build

      - name: Verify packages
        run: npm run check

      - name: Publish unpublished workspace packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail

          node - <<'NODE' > /tmp/pi-workspaces.tsv
          const fs = require("node:fs");
          const path = require("node:path");

          const extensionsDir = "extensions";
          for (const dirent of fs.readdirSync(extensionsDir, { withFileTypes: true })) {
            if (!dirent.isDirectory()) continue;

            const packageJsonPath = path.join(extensionsDir, dirent.name, "package.json");
            if (!fs.existsSync(packageJsonPath)) continue;

            const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, "utf8"));
            if (packageJson.private) continue;

            console.log(`${packageJson.name}\t${packageJson.version}`);
          }
          NODE

          while IFS=$'\t' read -r package version; do
            if [ -z "$package" ] || [ -z "$version" ]; then
              continue
            fi

            if npm view "${package}@${version}" version >/dev/null 2>&1; then
              echo "${package}@${version} already exists; skipping publish."
              continue
            fi

            echo "Publishing ${package}@${version} to npm..."
            npm --workspace "$package" publish --access public --loglevel verbose
          done < /tmp/pi-workspaces.tsv

      - name: Configure GitHub Packages registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://npm.pkg.github.com"
          scope: "@sreetej510"

      - name: Publish unpublished workspace packages to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "false"
          GITHUB_PACKAGES_REGISTRY: "https://npm.pkg.github.com"
        run: |
          set -euo pipefail

          while IFS=$'\t' read -r package version; do
            if [ -z "$package" ] || [ -z "$version" ]; then
              continue
            fi

            if npm view "${package}@${version}" version --registry "$GITHUB_PACKAGES_REGISTRY" >/dev/null 2>&1; then
              echo "${package}@${version} already exists on GitHub Packages; skipping publish."
              continue
            fi

            echo "Publishing ${package}@${version} to GitHub Packages..."
            npm --workspace "$package" publish \
              --registry "$GITHUB_PACKAGES_REGISTRY" \
              --access public \
              --loglevel verbose
          done < /tmp/pi-workspaces.tsv
